services:
  monochrome-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      CHROME_NO_SANDBOX: "true"
      # PUBLIC_URL: https://music.example.com   # set if behind a proxy / public host
    env_file:
      - path: .env
        required: false
    # Chromium is unhappy with the default 64MB /dev/shm.
    shm_size: "1gb"
    volumes:
      # persist the downloaded Chromium so it isn't re-fetched on every recreate
      - cloak-cache:/home/node/.cloakbrowser
    restart: unless-stopped

volumes:
  cloak-cache:
